name: Visual snapshots

# On-demand comparison. Replacing expected images is an explicit input so a
# regression cannot silently bless itself as the new baseline.

on:
  workflow_dispatch:
    inputs:
      refresh_baselines:
        description: Replace and commit the expected screenshots
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare against committed screenshots
        if: ${{ !inputs.refresh_baselines }}
        env:
          VISUAL: '1'
        run: npx playwright test e2e/visual.spec.js
      - name: Refresh baseline screenshots
        if: ${{ inputs.refresh_baselines }}
        env:
          VISUAL: '1'
        run: npx playwright test e2e/visual.spec.js --update-snapshots
      - name: Commit baselines
        if: ${{ inputs.refresh_baselines }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore: refresh visual snapshot baselines [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: e2e/visual.spec.js-snapshots/
          if-no-files-found: warn
