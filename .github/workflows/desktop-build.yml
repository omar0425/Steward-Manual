name: Desktop installer

# On-demand build of the Steward desktop app on GitHub's own runners —
# official Electron binaries, no local Node/npm needed. Run it from the
# Actions tab ("Run workflow") or ask Claude to trigger it; the finished
# installer lands as a downloadable artifact on the run page.

on:
  workflow_dispatch:

# The release step publishes the installer as a public download.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      # Monotonic version per build: the installed app auto-updates only when a
      # release's version exceeds its own, so every build must count upward.
      - name: Stamp build version
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
        working-directory: desktop
      # --publish always: electron-builder creates release v1.0.<run> with the
      # installer AND latest.yml — the manifest installed apps poll to discover
      # updates (downloaded in the background, applied on quit). The permanent
      # no-login download link is /releases/latest/download/Steward.Setup.exe
      # (artifactName is version-free so the URL never changes).
      - name: Build and publish Windows installer
        run: npx electron-builder --win --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifact (fallback copy)
        uses: actions/upload-artifact@v4
        with:
          name: Steward-Windows-Setup
          path: |
            desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error
