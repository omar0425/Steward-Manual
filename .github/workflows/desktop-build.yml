name: Desktop installer

# On-demand build of the Steward desktop app on GitHub's own runners —
# official Electron binaries, no local Node/npm needed. Run it from the
# Actions tab ("Run workflow") or ask Claude to trigger it; the finished
# installer lands as a downloadable artifact on the run page.

on:
  workflow_dispatch:

# The release step publishes the installer as a public download.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Windows installer
        run: npx electron-builder --win
        working-directory: desktop
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steward-Windows-Setup
          path: |
            desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error
      # Also publish to a rolling "desktop-latest" release: unlike artifacts,
      # release assets are a permanent DIRECT download — no GitHub login, no
      # zip wrapper, no 14-day expiry. Re-running the workflow replaces the
      # asset in place, so the download URL never changes.
      - name: Publish to the desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Steward Desktop (latest)
          body: |
            The Steward desktop app for Windows — installs a desktop shortcut,
            Start-menu entry, and a system-tray icon. Built automatically from
            main by the "Desktop installer" workflow.
          files: desktop/dist/*.exe
          make_latest: true
