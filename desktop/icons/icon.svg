<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#141c30"/>
      <stop offset="55%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#090c14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c876"/>
      <stop offset="45%" stop-color="#c8a84c"/>
      <stop offset="100%" stop-color="#9a7c2e"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a5e"/>
      <stop offset="60%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#101729"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile with a gold rim -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none"
        stroke="url(#gold)" stroke-width="7" opacity="0.9"/>

  <!-- Top hat: crown -->
  <path d="M162 138
           q0 -14 14 -14 h160 q14 0 14 14
           v150 h-188 z" fill="url(#hat)"/>
  <!-- crown rim light -->
  <path d="M176 126 h160 q14 0 14 14 v10
           q-4 -12 -18 -12 h-152 q-14 0 -18 12 v-10 q0 -14 14 -14 z"
        fill="#3a4a74" opacity="0.55"/>

  <!-- Gold band -->
  <rect x="162" y="246" width="188" height="44" fill="url(#gold)"/>

  <!-- Brim -->
  <path d="M110 288 h292 q18 0 18 18 q0 18 -18 18 h-292 q-18 0 -18 -18 q0 -18 18 -18 z"
        fill="url(#hat)"/>
  <path d="M110 316 h292 q10 0 14 -6 q-2 14 -18 14 h-284 q-16 0 -18 -14 q4 6 14 6 z"
        fill="#000000" opacity="0.35"/>

  <!-- Monocle: chain then ring so the ring overlaps -->
  <path d="M368 342 q6 34 -10 44" fill="none" stroke="url(#gold)"
        stroke-width="9" stroke-linecap="round"/>
  <circle cx="366" cy="300" r="54" fill="rgba(200,220,255,0.10)"/>
  <circle cx="366" cy="300" r="54" fill="none" stroke="url(#gold)" stroke-width="17"/>
  <!-- lens glint -->
  <path d="M340 278 q10 -14 30 -16" fill="none" stroke="#ffffff"
        stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
