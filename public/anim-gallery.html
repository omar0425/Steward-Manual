<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward — Animation Gallery (all 10 stages, live)</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; padding: 24px 28px 56px; background: #0b0f18; color: #e8e6df;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { max-width: 1200px; margin: 0 auto 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #8a8f9c; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    padding: 12px 16px; background: #131826; border: 1px solid #232a3a; border-radius: 10px; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .controls input { width: 16px; height: 16px; accent-color: #d4af37; }
  .controls .hint { color: #8a8f9c; font-size: 12px; }
  .ag-grid { max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 240px));
    gap: 26px; justify-content: center; }
  .ag-card { display: flex; flex-direction: column; gap: 10px; }
  .ag-quote { background: #131826; border: 1px solid #232a3a; border-radius: 10px; padding: 10px 12px; }
  .ag-quote .lab { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: #d4af37; }
  .ag-quote p { margin: 4px 0 0; font-size: 13px; color: #c7ccd6; line-height: 1.4; }

  /* Replicate the gameplay .hero-section tier-card overrides so each card matches
     the live dashboard hero exactly. */
  .hero-tier-card .tier-card-gap { display: none; }
  .hero-tier-card .tier-card-name { font-size: 22px; }
  .hero-tier-card .tier-card-badge { font-size: 16px; padding: 3px 8px 2px; top: 10px; left: 10px; }
  .hero-tier-card .tier-card-character-mount { bottom: 128px; padding-top: 28px; align-items: flex-end; }
  .hero-tier-card .tier-card-footer { padding: 44px 16px 16px; gap: 7px; }
  .hero-tier-card .tier-card-debt { font-size: 11px; }
  .hero-tier-card .tier-card-character-mount > div { transform: scale(1.0); transform-origin: center bottom; }

  body.is-paused .steward-wrap * { animation-play-state: paused !important; }
  /* The hidden props are switched off two different ways: the racecar via inline
     CSS vars (which beat normal stylesheet rules → need !important), and the
     mansion via hard-coded opacity/display rules. Force both on. */
  body.reveal-props .steward-wrap {
    --car-opacity: 1 !important; --ring-opacity: 1 !important;
    --coin-shower-opacity: 1 !important; --ornament-opacity: 1 !important;
    --ledger-opacity: 1 !important; --coinup-opacity: 1 !important;
    --blueprint-opacity: 1 !important; --watch-opacity: 1 !important;
  }
  /* In the product the racecar shows only at winning and the mansion only at
     wealthy; re-show them everywhere for inspection. */
  body.reveal-props .sw-racecar,
  body.reveal-props .wealthy-mansion { display: block !important; opacity: 1 !important; }
</style>
</head>
<body>
  <header>
    <h1>Steward — Animation Gallery</h1>
    <p class="sub">All 10 stages rendered live at the exact gameplay hero scale (real template, CSS, and animations). Hover a card; click the character to cycle quotes is dashboard-only.</p>
    <div class="controls">
      <label><input type="checkbox" id="reveal"> Reveal hidden props <span class="hint">(forces car / rings / coin-shower / ornaments visible)</span></label>
      <label><input type="checkbox" id="pause"> Pause animations <span class="hint">(freeze to inspect a frame)</span></label>
    </div>
  </header>
  <div class="ag-grid" id="grid"></div>

  <script type="module" src="/js/anim-gallery.js"></script>
</body>
</html>
